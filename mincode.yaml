# Min Code Agent configuration
# Values can be overridden by environment variables:
#   MINCODE_PROVIDER_TYPE, MINCODE_BASE_URL, MINCODE_API_KEY / OPENAI_API_KEY,
#   MINCODE_MODEL / OPENAI_MODEL, MINCODE_TRACE_DIR, MINCODE_MAX_TOKENS

provider:
  # openai-compatible | fake
  type: openai-compatible
  base_url: https://api.openai.com/v1
  # api_key: prefer env OPENAI_API_KEY or MINCODE_API_KEY
  model: gpt-4o-mini
  temperature: 0.7
  timeout_sec: 120

agent:
  max_steps: 30
  token_budget: 32000
  # History compaction threshold (estimated tokens). 0 uses default 18000; set -1 to disable.
  compress_at: 18000
  # Concurrent read-only tool calls (read_file/list_dir/glob/grep) in one LLM response.
  parallel_tools: true
  max_parallel: 4

trace:
  dir: .mincode/traces
